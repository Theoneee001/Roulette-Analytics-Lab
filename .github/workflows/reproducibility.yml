name: Reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/.matplotlib
      IPYTHONDIR: ${{ github.workspace }}/.ipython
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Rebuild analysis artifacts
        run: python scripts/run_analysis.py

      - name: Execute teaching notebook
        run: python scripts/build_notebook.py

      - name: Build technical report
        run: python scripts/build_report_pdf.py

      - name: Cross-check published artifacts
        run: python scripts/verify_artifacts.py

      - name: Check deterministic text, data, and notebook outputs
        run: >-
          git diff --exit-code --
          data/example_unbiased_spins.csv
          data/example_biased_spins.csv
          outputs/tables
          outputs/analysis_summary.md
          notebooks/roulette_analytics.ipynb
